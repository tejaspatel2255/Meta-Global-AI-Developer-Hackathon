[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "benchguard"
version = "0.1.0"
description = "Software-only camera copilot that verifies a physical procedure against an SOP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "openai>=1.50",
  "meta-sam-parser>=0.0.6",
  "httpx>=0.27",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["live: hits the Meta Model API (needs MODEL_API_KEY)"]

[tool.ruff]
src = ["backend"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["benchguard.contracts", "benchguard.geometry", "benchguard.engine", "benchguard.compiler"]

[tool.coverage.run]
source = ["backend/benchguard/contracts", "backend/benchguard/geometry", "backend/benchguard/engine", "backend/benchguard/compiler"]
